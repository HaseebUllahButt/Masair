<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Splendor: the rider's view. A road running into a dusk sun between
       low-poly ranges, handlebars at the bottom of the frame. Built to read
       at 32 px: one bright disc, one dark wedge, one pale centre line. -->
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12183c"/>
      <stop offset="34%" stop-color="#3a2456"/>
      <stop offset="56%" stop-color="#c45e78"/>
      <stop offset="70%" stop-color="#f6b06a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2c4"/>
      <stop offset="55%" stop-color="#ffc072"/>
      <stop offset="100%" stop-color="#ff7d5c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd59a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffd59a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2f4a"/>
      <stop offset="100%" stop-color="#15141f"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2140"/>
      <stop offset="100%" stop-color="#0d0c16"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- A few stars still up in the top of the sky -->
    <g fill="#fff4dc">
      <circle cx="92" cy="74" r="3.2" opacity="0.8"/>
      <circle cx="404" cy="58" r="2.6" opacity="0.7"/>
      <circle cx="346" cy="118" r="2" opacity="0.5"/>
      <circle cx="158" cy="132" r="1.8" opacity="0.45"/>
    </g>

    <!-- Sun, sinking into the pass, banded the way a low sun shimmers -->
    <circle cx="256" cy="246" r="150" fill="url(#halo)"/>
    <circle cx="256" cy="246" r="92" fill="url(#sun)"/>
    <g fill="#c45e78">
      <rect x="150" y="262" width="212" height="6"/>
      <rect x="150" y="280" width="212" height="8"/>
      <rect x="150" y="312" width="212" height="11"/>
    </g>

    <!-- Far range: pale with distance -->
    <path d="M0 318 L58 262 L104 296 L156 236 L214 300 L256 284 L300 302 L352 230 L408 290 L452 254 L512 300 L512 360 L0 360 Z" fill="#7a4a72"/>
    <!-- Near range: faceted, lit side and shade side -->
    <path d="M0 340 L70 280 L132 336 Z" fill="#4a2f5c"/>
    <path d="M70 280 L132 336 L176 318 L112 300 Z" fill="#3a2550"/>
    <path d="M512 336 L444 270 L386 334 Z" fill="#3a2550"/>
    <path d="M444 270 L386 334 L346 322 L404 296 Z" fill="#4a2f5c"/>
    <rect x="0" y="330" width="512" height="182" fill="url(#land)"/>

    <!-- Road to the vanishing point in the pass -->
    <path d="M256 318 L268 318 L470 512 L42 512 L244 318 Z" fill="url(#road)"/>
    <!-- Kerb lines, catching the sun -->
    <path d="M246 320 L56 512 L80 512 L250 320 Z" fill="#f6b06a" opacity="0.85"/>
    <path d="M266 320 L456 512 L432 512 L262 320 Z" fill="#f6b06a" opacity="0.85"/>
    <!-- Centre dashes, growing toward the rider -->
    <g fill="#fff2dc">
      <path d="M254 330 L258 330 L259 342 L253 342 Z" opacity="0.8"/>
      <path d="M252 358 L260 358 L262 380 L250 380 Z" opacity="0.9"/>
      <path d="M248 408 L264 408 L268 446 L244 446 Z"/>
    </g>

    <!-- Handlebars and gauge: the bike, from the saddle -->
    <path d="M40 470 C110 436 170 430 214 440 L298 440 C342 430 402 436 472 470 L472 490 C402 460 342 458 298 466 L214 466 C170 458 110 460 40 490 Z" fill="#0b0b12"/>
    <rect x="18" y="466" width="70" height="30" rx="15" fill="#0b0b12" transform="rotate(-18 53 481)"/>
    <rect x="424" y="466" width="70" height="30" rx="15" fill="#0b0b12" transform="rotate(18 459 481)"/>
    <!-- Rim light along the top of the bars, so they hold against the dark verge -->
    <path d="M40 470 C110 436 170 430 214 440 L298 440 C342 430 402 436 472 470" fill="none" stroke="#f6b06a" stroke-width="3" opacity="0.7"/>
    <circle cx="256" cy="476" r="44" fill="#0b0b12"/>
    <circle cx="256" cy="476" r="30" fill="#1b1b28" stroke="#f6b06a" stroke-width="4"/>
    <path d="M256 476 L276 458" stroke="#ff7d5c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="256" cy="476" r="5" fill="#f6b06a"/>
  </g>
</svg>
